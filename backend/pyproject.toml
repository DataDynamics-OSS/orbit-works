[project]
name = "dlm-backend"
version = "0.1.0"
description = "Developer / License Manager backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.19",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "aiofiles>=24.1.0",
    "aiosmtplib>=3.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8.0", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"
