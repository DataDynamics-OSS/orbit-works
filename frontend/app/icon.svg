<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Orbit ERP favicon — 3중 동심원 (ERP 모듈 계층 / 궤도 메타포).
    브랜드 컬러 hsl(221.2 83.2% 53.3%) ≈ #2563EB.
    바깥일수록 흐리게 → 안쪽 코어로 시선 모음. 16×16 tab 에서도 식별
    가능하도록 stroke 2 + 충분한 반지름 간격.
  -->
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <circle cx="16" cy="16" r="14" opacity="0.4"/>
    <circle cx="16" cy="16" r="9"  opacity="0.7"/>
  </g>
  <circle cx="16" cy="16" r="4" fill="#2563EB"/>
</svg>
